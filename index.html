<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="apple-itunes-app" content="app-id=6811364629">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrooveLinker</title>
<style>
  :root{--ink:#17171c;--muted:#5d5d69;--line:#e3e3e8;--bg:#fbfaf7;--accent:#c8901f}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",-apple-system,system-ui,sans-serif;
    line-height:1.85;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{max-width:560px;padding:40px 24px;text-align:center}
  .disc{width:56px;height:56px;border-radius:50%;background:#17171c;position:relative;margin:0 auto 20px}
  .disc::after{content:"";position:absolute;inset:21px;border-radius:50%;background:var(--accent)}
  h1{font-size:30px;margin:0 0 10px;letter-spacing:.01em}
  p{color:#3a3a45;margin:0 0 26px}
  a{color:#9a6a10}
  .links a{margin:0 12px}
  .lead-stores{margin:0 0 12px;font-weight:600}
  footer{margin-top:36px;color:var(--muted);font-size:13px}
  @media (prefers-color-scheme:dark){
    :root{--ink:#f2f2f5;--muted:#9a9aa6;--line:#2b2b33;--bg:#0e0e12;--accent:#e8b44a}
    p{color:#dcdce2} a{color:#e8b44a}
  }
  /* Store badges — official artwork, unaltered. Apple's at 45 px tall with at
     least a quarter of its height clear around it; Google's PNG carries its
     own margin, so it is drawn at 59 px for a visible 45. */
  .stores{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;margin:0 0 26px}
  .stores[hidden]{display:none}
  .stores a{display:block;line-height:0}
  .stores img{display:block}
</style>
<noscript><style>.stores[hidden]{display:flex}</style></noscript>
</head>
<body>
  <div class="card">
    <div class="disc"></div>
    <h1>GrooveLinker</h1>
    <p>ターンテーブルの前に iPhone を置くだけで、アナログ DJ のビートマッチをスコアチェックするアプリ。</p>
    <p class="lead-stores">iPhone と Android で使えます</p>
    <div class="stores" hidden>
      <a class="appstore" href="https://apps.apple.com/app/id6811364629?ct=web-top&amp;mt=8"><img src="badges/appstore-ja.svg" alt="App Store からダウンロード" width="135" height="45"></a>
      <a class="play" href="https://play.google.com/store/apps/details?id=com.groovelinker.app&amp;referrer=utm_source%3Dgroovelinker.com%26utm_medium%3Dweb%26utm_campaign%3Dtop"><img src="badges/googleplay-ja.png" alt="Google Play で手に入れよう" width="151" height="59"></a>
    </div>
    <p class="links"><a href="privacy.html">プライバシーポリシー</a><a href="mailto:sato-s@ideo.co.jp">お問い合わせ</a></p>
    <footer>
    <div class="stores" hidden>
      <a class="appstore" href="https://apps.apple.com/app/id6811364629?ct=web-footer&amp;mt=8"><img src="badges/appstore-ja.svg" alt="App Store からダウンロード" width="135" height="45"></a>
      <a class="play" href="https://play.google.com/store/apps/details?id=com.groovelinker.app&amp;referrer=utm_source%3Dgroovelinker.com%26utm_medium%3Dweb%26utm_campaign%3Dfooter"><img src="badges/googleplay-ja.png" alt="Google Play で手に入れよう" width="151" height="59"></a>
    </div>
    © 2026 IDEO ENTERTAINMENT INC.</footer>
  </div>
<script src="stores.js"></script>
</body>
</html>
